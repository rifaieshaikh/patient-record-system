version: "3.9"

services:
  postgres:
    image: postgres:13
    environment:
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=temporal
      - POSTGRES_DB=temporal
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:1.26.3
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - LOG_LEVEL=info
      - DB=postgres12
      - POSTGRES_SEEDS=postgres
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 50s

  temporal-ui:
    image: temporalio/ui:2.39.0
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "8088:8080"
    depends_on:
      temporal:
        condition: service_healthy

  mongo:
    image: mongo:6.0.26
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 30

  http:
    build:
      context: .
      dockerfile: http/Dockerfile
    container_name: prs-http
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=prs
      - TEMPORAL_TARGET=temporal:7233
      - TEMPORAL_CREATE_PATIENT_TASK_QUEUE=prs-create-patient-task-queue
      - TRANSACTION_TIMEOUT_SECONDS=60
    ports:
      - "8080:8080"
    depends_on:
      mongo:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: prs-worker
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=prs
      - TEMPORAL_TARGET=temporal:7233
      - TEMPORAL_CREATE_PATIENT_TASK_QUEUE=prs-create-patient-task-queue
      - TRANSACTION_TIMEOUT_SECONDS=60
    ports:
      - "8081:8081"
    depends_on:
      mongo:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pgdata:
  mongo_data:
